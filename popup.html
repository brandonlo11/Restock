<!DOCTYPE html>
<html>
<head>
  <title>Stock Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Stock Monitor</h1>
    <div id="current-monitoring" class="section">
      <h2>Currently Monitoring</h2>
      <div id="monitoring-list"></div>
    </div>
    <div id="add-monitor" class="section">
      <h2>Add New Monitor</h2>
      <div id="product-info">
        <p>Select a product and its variants on the page, then click the button below to start monitoring.</p>
        <button id="start-monitoring" class="primary-button">Monitor Current Product</button>
      </div>
    </div>
    <div id="settings" class="section">
      <h2>Settings</h2>
      <div class="setting-item">
        <label for="check-interval">Check Interval (minutes):</label>
        <input type="number" id="check-interval" min="1" value="5">
      </div>
      <div class="setting-item">
        <label for="email-notifications">Email Notifications:</label>
        <input type="checkbox" id="email-notifications">
      </div>
      <div class="setting-item" id="email-input-container" style="display: none;">
        <label for="email">Email Address:</label>
        <input type="email" id="email">
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
