<!DOCTYPE html>
<html>
<head>
  <title>Stock Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Stock Monitor</h1>
    </header>

    <section class="settings-section">
      <div class="form-group">
        <label for="checkInterval">Check Interval (minutes)</label>
        <input type="number" id="checkInterval" min="1" value="5">
      </div>

      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" id="emailNotifications">
          <span>Enable Email Notifications</span>
        </label>
      </div>

      <div class="form-group" id="emailGroup" style="display: none;">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email">
      </div>

      <button id="saveSettings" class="primary-button">Save Settings</button>
    </section>

    <section class="monitor-section">
      <h2>Monitor Current Product</h2>
      <p>Select a product and its variants on the page, then click the button below to start monitoring.</p>
      <button id="startMonitoring" class="primary-button">Monitor Current Product</button>
    </section>

    <section class="monitoring-list">
      <h2>Monitoring List</h2>
      <div id="monitoringList"></div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
